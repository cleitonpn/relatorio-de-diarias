name: Publicar

on:
  push:
    branches: [main, claude/contractor-management-tool-s2snuf]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Gerar o site
        run: npm run build

      - name: Preparar credencial do Firebase
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/chave.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/chave.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # As regras do Firestore são o que impede um empreiteiro de ver os dados
      # de outro — falhar aqui é grave e o job termina em vermelho no fim.
      # Mas não adianta travar a publicação do site por causa disso: o site
      # sem regras novas é inofensivo, e quem precisa das regras publica pelo
      # Console enquanto a permissão não estiver ajustada.
      - name: Publicar regras e índices do Firestore
        id: regras
        continue-on-error: true
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes \
            --project diarias-app-cd76f \
            --non-interactive

      # O Storage ainda não é usado pelo app (nenhuma foto é enviada por
      # enquanto). Enquanto o bucket não estiver liberado para a conta de
      # serviço, este passo avisa e segue — nunca derruba o deploy do resto.
      - name: Publicar regras do Storage (opcional)
        continue-on-error: true
        run: |
          npx --yes firebase-tools@latest deploy \
            --only storage \
            --project diarias-app-cd76f \
            --non-interactive \
          || echo "AVISO: regras do Storage não publicadas. Libere o bucket para a conta de serviço quando o envio de fotos entrar."

      - name: Remover credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/chave.json"

      - name: Publicar o site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: diarias-app-cd76f

      # O site sobe, mas o run fica vermelho para as regras não passarem batido.
      - name: Cobrar as regras que não subiram
        if: steps.regras.outcome == 'failure'
        run: |
          echo "::error::As regras do Firestore NAO foram publicadas (403 na API firebaserules)."
          echo ""
          echo "O site foi publicado, mas o banco continua com as regras antigas."
          echo ""
          echo "Para resolver de vez, no Google Cloud Console:"
          echo "  IAM e administrador -> IAM -> localizar a conta de servico"
          echo "  firebase-adminsdk-...@diarias-app-cd76f.iam.gserviceaccount.com"
          echo "  -> Editar -> Adicionar outra funcao -> 'Firebase Rules Admin'"
          echo "  (e 'Cloud Datastore Index Admin' para os indices)."
          echo ""
          echo "Enquanto isso, publique a mao: Console do Firebase -> Firestore"
          echo "Database -> aba Regras -> colar firestore.rules -> Publicar."
          exit 1
