name: Publicar

on:
  push:
    branches: [main, claude/contractor-management-tool-s2snuf]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Gerar o site
        run: npm run build

      - name: Preparar credencial do Firebase
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/chave.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/chave.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # As regras do Firestore são o que impede um empreiteiro de ver os dados
      # de outro. Se este passo falhar, o deploy TEM que falhar junto.
      - name: Publicar regras e índices do Firestore
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes \
            --project diarias-app-cd76f \
            --non-interactive

      # O Storage ainda não é usado pelo app (nenhuma foto é enviada por
      # enquanto). Enquanto o bucket não estiver liberado para a conta de
      # serviço, este passo avisa e segue — nunca derruba o deploy do resto.
      - name: Publicar regras do Storage (opcional)
        continue-on-error: true
        run: |
          npx --yes firebase-tools@latest deploy \
            --only storage \
            --project diarias-app-cd76f \
            --non-interactive \
          || echo "AVISO: regras do Storage não publicadas. Libere o bucket para a conta de serviço quando o envio de fotos entrar."

      - name: Remover credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/chave.json"

      - name: Publicar o site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: diarias-app-cd76f
