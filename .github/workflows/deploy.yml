name: Publicar

on:
  push:
    branches: [main, claude/contractor-management-tool-s2snuf]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Gerar o site
        run: npm run build

      # A action de Hosting publica SÓ o site. As regras de segurança e os
      # índices precisam de um deploy próprio — sem isso o app sobe no ar
      # mas o banco continua negando tudo.
      - name: Publicar regras e índices
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/chave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/chave.json"
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project diarias-app-cd76f \
            --non-interactive
          rm -f "$RUNNER_TEMP/chave.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar o site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: diarias-app-cd76f
